<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="g29a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d26"/>
      <stop offset="55%" stop-color="#3b4a6b"/>
      <stop offset="100%" stop-color="#1a1d26"/>
    </linearGradient>
    <radialGradient id="g29b" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#a9c2e8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a9c2e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g29c" cx="50%" cy="50%" r="75%">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".65"/>
    </radialGradient>
    <filter id="g29n">
