  <rect width="1200" height="1500" fill="url(#g29a)"/>
  <rect width="1200" height="1500" fill="url(#g29b)"/>

  <g opacity=".35" fill="none" stroke="#a9c2e8" stroke-width="1.5">
    <circle cx="600" cy="630" r="312"/>
    <circle cx="600" cy="630" r="396" opacity=".5"/>
  </g>

  <rect width="1200" height="1500" fill="url(#g29c)"/>
  <rect width="1200" height="1500" filter="url(#g29n)" opacity=".07"/>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="780" font-size="90"
