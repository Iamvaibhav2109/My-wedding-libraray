<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="g35a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c1a"/>
      <stop offset="55%" stop-color="#33564c"/>
      <stop offset="100%" stop-color="#141c1a"/>
