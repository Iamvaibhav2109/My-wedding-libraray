<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="g30a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26200f"/>
      <stop offset="55%" stop-color="#6d5b22"/>
      <stop offset="100%" stop-color="#26200f"/>
    </linearGradient>
    <radialGradient id="g30b" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#e8d38a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#e8d38a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g30c" cx="50%" cy="50%" r="75%">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".65"/>
    </radialGradient>
    <filter id="g30n">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#g30a)"/>
  <rect width="1920" height="1200" fill="url(#g30b)"/>

  <g opacity=".35" fill="none" stroke="#e8d38a" stroke-width="1.5">
    <circle cx="960" cy="504" r="312"/>
    <circle cx="960" cy="504" r="396" opacity=".5"/>
  </g>

  <rect width="1920" height="1200" fill="url(#g30c)"/>
  <rect width="1920" height="1200" filter="url(#g30n)" opacity=".07"/>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="960" y="624" font-size="90"
      fill="#ffffff" fill-opacity=".92" letter-spacing="14">The Pristine Hotel</text>
    <text x="960" y="720" font-size="38"
      fill="#e8d38a" fill-opacity=".9" letter-spacing="12">VENUE</text>
